name: Build DodecaDragons DEB and IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Build Native Swift App with Window Navigation Menu, .deb, and .ipa
        run: |
          APP_DIR="DodecaDragons.app"
          mkdir -p "$APP_DIR/WebAssets"

          # Copy web assets
          cp -r index.html style.css 98.css changelog.txt savebank.txt fonts img scripts "$APP_DIR/WebAssets/" 2>/dev/null || true

          # 1. Write Native Swift Source with Menu Structure, Touch Optimization & FPS removal
          cat << 'EOF' > main.swift
          import UIKit
          import WebKit

          class AppDelegate: UIResponder, UIApplicationDelegate, WKUIDelegate {
              var window: UIWindow?
              var webView: WKWebView?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  self.window = window

                  let config = WKWebViewConfiguration()
                  config.websiteDataStore = .default()
                  config.preferences.javaScriptCanOpenWindowsAutomatically = true

                  // Mobile Enhancements + Window Navigation Menu + FPS Counter Removal
                  let enhancementsScript = """
                  (function() {
                      // 1. Mobile viewport scaling
                      if (!document.querySelector('meta[name="viewport"]')) {
                          var meta = document.createElement('meta');
                          meta.name = 'viewport';
                          meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
                          document.head.appendChild(meta);
                      }

                      // 2. CSS Styles for Mobile Window Menu Bar & FPS Counter Hiding
                      var style = document.createElement('style');
                      style.textContent = `
                          /* Completely hide FPS counter */
                          #fps, .fps, [id*="fps" i] {
                              display: none !important;
                              visibility: hidden !important;
                              opacity: 0 !important;
                              pointer-events: none !important;
                          }

                          /* Touch optimization & body spacing for native header */
                          body {
                              -webkit-touch-callout: none !important;
                              -webkit-user-select: none !important;
                              user-select: none !important;
                              touch-action: manipulation;
                              padding-top: calc(env(safe-area-inset-top) + 48px) !important;
                              padding-bottom: env(safe-area-inset-bottom) !important;
                              box-sizing: border-box;
                          }

                          input, textarea {
                              -webkit-user-select: auto !important;
                              user-select: auto !important;
                          }

                          /* Mobile Menu Header Bar */
                          #mobile-nav-bar {
                              position: fixed;
                              top: 0;
                              left: 0;
                              right: 0;
                              height: calc(env(safe-area-inset-top) + 44px);
                              padding-top: env(safe-area-inset-top);
                              background: #c0c0c0;
                              border-bottom: 2px solid #808080;
                              display: flex;
                              align-items: center;
                              padding-left: 8px;
                              padding-right: 8px;
                              z-index: 999999;
                              box-sizing: border-box;
                              box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                              overflow-x: auto;
                              white-space: nowrap;
                              -webkit-overflow-scrolling: touch;
                          }

                          #mobile-nav-bar::-webkit-scrollbar {
                              display: none;
                          }

                          .mobile-nav-btn {
                              display: inline-block;
                              padding: 4px 10px;
                              margin-right: 6px;
                              font-size: 13px;
                              font-family: 'Pixelated MS Sans Serif', Arial, sans-serif;
                              cursor: pointer;
                              white-space: nowrap;
                              flex-shrink: 0;
                          }

                          .mobile-nav-btn.active {
                              font-weight: bold;
                              background: #000080;
                              color: #ffffff;
                          }

                          /* Smooth focus animation when switching windows */
                          .window {
                              scroll-margin-top: calc(env(safe-area-inset-top) + 54px);
                              transition: box-shadow 0.2s ease-in-out;
                          }

                          .window-focused {
                              box-shadow: 0 0 12px #ffff00 !important;
                              z-index: 1000 !important;
                          }
                      `;
                      document.head.appendChild(style);

                      // 3. Inject Dynamic Window Menu Structure
                      function setupWindowNavMenu() {
                          if (document.getElementById('mobile-nav-bar')) return;

                          var navBar = document.createElement('div');
                          navBar.id = 'mobile-nav-bar';

                          // Query all windows on screen
                          var windows = document.querySelectorAll('.window');
                          if (!windows || windows.length === 0) {
                              setTimeout(setupWindowNavMenu, 500);
                              return;
                          }

                          windows.forEach(function(win, idx) {
                              var titleBar = win.querySelector('.title-bar-text') || win.querySelector('.title-bar') || win.querySelector('h1, h2, h3');
                              var titleText = titleBar ? titleBar.innerText.trim() : ('Window ' + (idx + 1));
                              if (!titleText) titleText = 'Tab ' + (idx + 1);

                              var btn = document.createElement('button');
                              btn.className = 'mobile-nav-btn';
                              btn.innerText = titleText;

                              btn.onclick = function() {
                                  // Remove active styles
                                  document.querySelectorAll('.mobile-nav-btn').forEach(b => b.classList.remove('active'));
                                  document.querySelectorAll('.window').forEach(w => w.classList.remove('window-focused'));

                                  btn.classList.add('active');
                                  win.classList.add('window-focused');

                                  // Scroll the selected window into view smoothly
                                  win.scrollIntoView({ behavior: 'smooth', block: 'start' });

                                  // If the window has display:none, unhide it
                                  if (win.style.display === 'none') {
                                      win.style.display = 'block';
                                  }

                                  setTimeout(function() {
                                      win.classList.remove('window-focused');
                                  }, 1500);
                              };

                              navBar.appendChild(btn);
                          });

                          document.body.appendChild(navBar);

                          // Double check removing FPS element
                          var fpsEl = document.getElementById('fps');
                          if (fpsEl) fpsEl.remove();
                      }

                      if (document.readyState === 'complete' || document.readyState === 'interactive') {
                          setTimeout(setupWindowNavMenu, 300);
                      } else {
                          window.addEventListener('DOMContentLoaded', setupWindowNavMenu);
                      }
                  })();
                  """

                  let userScript = WKUserScript(
                      source: enhancementsScript,
                      injectionTime: .atDocumentEnd,
                      forMainFrameOnly: true
                  )
                  config.userContentController.addUserScript(userScript)

                  let webView = WKWebView(frame: window.bounds, configuration: config)
                  self.webView = webView
                  webView.uiDelegate = self
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 0.13, green: 0.13, blue: 0.13, alpha: 1.0)
                  webView.scrollView.bounces = true
                  webView.scrollView.contentInsetAdjustmentBehavior = .never

                  let rootVC = UIViewController()
                  rootVC.view = webView
                  window.rootViewController = rootVC
                  window.makeKeyAndVisible()

                  if let indexURL = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "WebAssets") {
                      webView.loadFileURL(indexURL, allowingReadAccessTo: indexURL.deletingLastPathComponent())
                  }

                  return true
              }

              private func topViewController() -> UIViewController? {
                  var top = window?.rootViewController
                  while let presented = top?.presentedViewController {
                      top = presented
                  }
                  return top
              }

              // Handle JavaScript alert()
              func webView(_ webView: WKWebView, runJavaScriptAlertPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping () -> Void) {
                  let alert = UIAlertController(title: "DodecaDragons", message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "OK", style: .default) { _ in completionHandler() })
                  topViewController()?.present(alert, animated: true)
              }

              // Handle JavaScript confirm()
              func webView(_ webView: WKWebView, runJavaScriptConfirmPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (Bool) -> Void) {
                  let alert = UIAlertController(title: "Confirm", message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "Cancel", style: .cancel) { _ in completionHandler(false) })
                  alert.addAction(UIAlertAction(title: "OK", style: .destructive) { _ in completionHandler(true) })
                  topViewController()?.present(alert, animated: true)
              }

              // Handle JavaScript prompt() - Save string importing/exporting
              func webView(_ webView: WKWebView, runJavaScriptTextInputPanelWithPrompt prompt: String, defaultText: String?, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (String?) -> Void) {
                  let alert = UIAlertController(title: prompt, message: nil, preferredStyle: .alert)
                  alert.addTextField { textField in
                      textField.text = defaultText
                      textField.placeholder = "Paste save data..."
                  }
                  alert.addAction(UIAlertAction(title: "Cancel", style: .cancel) { _ in completionHandler(nil) })
                  alert.addAction(UIAlertAction(title: "Import", style: .default) { _ in
                      completionHandler(alert.textFields?.first?.text)
                  })
                  topViewController()?.present(alert, animated: true)
              }
          }

          UIApplicationMain(
              CommandLine.argc,
              CommandLine.unsafeArgv,
              nil,
              NSStringFromClass(AppDelegate.self)
          )
          EOF

          # 2. Compile directly with Swiftc
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -sdk "$SDK_PATH" \
            -O \
            -o "$APP_DIR/DodecaDragons" \
            main.swift

          # 3. Write Info.plist
          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DodecaDragons</string>
              <key>CFBundleIdentifier</key>
              <string>com.demonin.dodecadragons</string>
              <key>CFBundleName</key>
              <string>DodecaDragons</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UIStatusBarHidden</key>
              <true/>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # 4. Sign binary for TrollStore/Jailbreak bypass
          brew install dpkg ldid
          ldid -S "$APP_DIR/DodecaDragons"

          # 5. Package as .deb
          mkdir -p deb_root/DEBIAN deb_root/Applications
          cp -r "$APP_DIR" deb_root/Applications/
          cat << 'EOF' > deb_root/DEBIAN/control
          Package: com.demonin.dodecadragons
          Name: DodecaDragons
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: DodecaDragons native iOS port with Window Navigation
          Maintainer: Demonin
          Author: Demonin
          Section: Games
          EOF
          chmod 755 deb_root/DEBIAN
          dpkg-deb -Zxz --build deb_root DodecaDragons_1.0.0_iphoneos-arm64.deb

          # 6. Package as .ipa
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r9 DodecaDragons.ipa Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DodecaDragons-Builds
          path: |
            DodecaDragons_1.0.0_iphoneos-arm64.deb
            DodecaDragons.ipa
