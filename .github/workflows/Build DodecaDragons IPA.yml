name: Build DodecaDragons DEB and IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Build Native App, .deb, and .ipa
        run: |
          # 1. Prepare App Bundle Layout
          APP_DIR="DodecaDragons.app"
          mkdir -p "$APP_DIR/WebAssets"

          # Copy web assets
          cp -r index.html style.css 98.css changelog.txt savebank.txt fonts img scripts "$APP_DIR/WebAssets/" 2>/dev/null || true

          # 2. Write minimal native Objective-C WKWebView wrapper
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate, WKUIDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @property (strong, nonatomic) WKWebView *webView;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              
              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              config.websiteDataStore = [WKWebsiteDataStore defaultDataStore];
              
              self.webView = [[WKWebView alloc] initWithFrame:self.window.bounds configuration:config];
              self.webView.UIDelegate = self;
              self.webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              
              UIViewController *rootVC = [[UIViewController alloc] init];
              rootVC.view = self.webView;
              self.window.rootViewController = rootVC;
              [self.window makeKeyAndVisible];
              
              NSURL *indexURL = [[NSBundle mainBundle] URLForResource:@"index" withExtension:@"html" subdirectory:@"WebAssets"];
              if (indexURL) {
                  [self.webView loadFileURL:indexURL allowingReadAccessToURL:[indexURL URLByDeletingLastPathComponent]];
              }
              return YES;
          }

          // Handle JavaScript prompt() for Save Import
          - (void)webView:(WKWebView *)webView runJavaScriptTextInputPanelWithPrompt:(NSString *)prompt defaultText:(NSString *)defaultText initiatedByFrame:(WKFrameInfo *)frame completionHandler:(void (^)(NSString *))completionHandler {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:prompt message:nil preferredStyle:UIAlertControllerStyleAlert];
              [alert addTextFieldWithConfigurationHandler:^(UITextField *tf) { tf.text = defaultText; }];
              [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:^(UIAlertAction *a) { completionHandler(nil); }]];
              [alert addAction:[UIAlertAction actionWithTitle:@"Import" style:UIAlertActionStyleDefault handler:^(UIAlertAction *a) { completionHandler(alert.textFields.firstObject.text); }]];
              [self.window.rootViewController presentViewController:alert animated:YES completion:nil];
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          # 3. Compile directly with clang (Bypasses XcodeGen and xcodebuild entirely)
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework UIKit \
            -framework WebKit \
            -framework Foundation \
            -o "$APP_DIR/DodecaDragons" \
            main.m

          # 4. Write Info.plist
          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DodecaDragons</string>
              <key>CFBundleIdentifier</key>
              <string>com.demonin.dodecadragons</string>
              <key>CFBundleName</key>
              <string>DodecaDragons</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UIStatusBarHidden</key>
              <true/>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # 5. Pseudo-sign binary for TrollStore/Jailbreak bypass
          brew install dpkg ldid
          ldid -S "$APP_DIR/DodecaDragons"

          # 6. Package as .deb
          mkdir -p deb_root/DEBIAN deb_root/Applications
          cp -r "$APP_DIR" deb_root/Applications/
          cat << 'EOF' > deb_root/DEBIAN/control
          Package: com.demonin.dodecadragons
          Name: DodecaDragons
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: DodecaDragons native iOS port
          Maintainer: Demonin
          Author: Demonin
          Section: Games
          EOF
          chmod 755 deb_root/DEBIAN
          dpkg-deb -Zxz --build deb_root DodecaDragons_1.0.0_iphoneos-arm64.deb

          # 7. Package as .ipa
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r9 DodecaDragons.ipa Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DodecaDragons-Builds
          path: |
            DodecaDragons_1.0.0_iphoneos-arm64.deb
            DodecaDragons.ipa
