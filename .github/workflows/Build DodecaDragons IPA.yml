name: Build DodecaDragons DEB and IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Build Notch-Proof App with Fixed HUD & Upper-Right Home
        run: |
          APP_DIR="DodecaDragons.app"
          mkdir -p "$APP_DIR/WebAssets"

          # Copy web assets
          cp -r index.html style.css 98.css changelog.txt savebank.txt fonts img scripts "$APP_DIR/WebAssets/" 2>/dev/null || true

          # Patch scripts directly for 300,000 starting gold & 3,000 fire
          for f in "$APP_DIR/WebAssets/scripts/"*.js; do
            if [ -f "$f" ]; then
              sed -i '' 's/gold: new ExpantaNum(0)/gold: new ExpantaNum(300000)/g' "$f" 2>/dev/null || true
              sed -i '' 's/gold:new ExpantaNum(0)/gold:new ExpantaNum(300000)/g' "$f" 2>/dev/null || true
              sed -i '' 's/fire: new ExpantaNum(0)/fire: new ExpantaNum(3000)/g' "$f" 2>/dev/null || true
              sed -i '' 's/fire:new ExpantaNum(0)/fire:new ExpantaNum(3000)/g' "$f" 2>/dev/null || true
            fi
          done

