name: Build DodecaDragons DEB and IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Build Notch-Aware Fullscreen App
        run: |
          APP_DIR="DodecaDragons.app"
          mkdir -p "$APP_DIR/WebAssets"

          # Copy web assets
          cp -r index.html style.css 98.css changelog.txt savebank.txt fonts img scripts "$APP_DIR/WebAssets/" 2>/dev/null || true

          # Patch scripts directly for 3,000,000 starting gold & 2,000 fire
          for f in "$APP_DIR/WebAssets/scripts/"*.js; do
            if [ -f "$f" ]; then
              sed -i '' 's/gold: new ExpantaNum(0)/gold: new ExpantaNum(3000000)/g' "$f" 2>/dev/null || true
              sed -i '' 's/gold:new ExpantaNum(0)/gold:new ExpantaNum(3000000)/g' "$f" 2>/dev/null || true
              sed -i '' 's/fire: new ExpantaNum(0)/fire: new ExpantaNum(2000)/g' "$f" 2>/dev/null || true
              sed -i '' 's/fire:new ExpantaNum(0)/fire:new ExpantaNum(2000)/g' "$f" 2>/dev/null || true
            fi
          done

          # 1. Write Native Swift Source
          cat << 'EOF' > main.swift
          import UIKit
          import WebKit

          class FullscreenViewController: UIViewController {
              override var prefersStatusBarHidden: Bool { true }
              override var prefersHomeIndicatorAutoHidden: Bool { true }
              override var preferredScreenEdgesDeferringSystemGestures: UIRectEdge { .all }
          }

          class AppDelegate: UIResponder, UIApplicationDelegate, WKUIDelegate, UIScrollViewDelegate {
              var window: UIWindow?
              var webView: WKWebView?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let screenBounds = UIScreen.main.bounds
                  let window = UIWindow(frame: screenBounds)
                  window.contentScaleFactor = UIScreen.main.scale
                  self.window = window

                  let config = WKWebViewConfiguration()
                  config.websiteDataStore = .default()
                  config.preferences.javaScriptCanOpenWindowsAutomatically = true

                  let enhancementsScript = """
                  (function() {
                      // 1. Lock viewport with cover mode so safe-area-insets map to the Dynamic Island / Notch
                      var meta = document.querySelector('meta[name="viewport"]');
                      if (!meta) {
                          meta = document.createElement('meta');
                          meta.name = 'viewport';
                          document.head.appendChild(meta);
                      }
                      meta.content = 'width=1280, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';

                      // 2. Inject CSS for notch padding and compact top-left Home button
                      var style = document.createElement('style');
                      style.textContent = `
                          /* Fixed root canvas prevents bouncing or resize flashes */
                          html, body {
                              position: fixed !important;
                              top: 0 !important;
                              left: 0 !important;
                              width: 100vw !important;
                              height: 100vh !important;
                              margin: 0 !important;
                              padding: 0 !important;
                              overflow: hidden !important;
                              -webkit-text-size-adjust: 100% !important;
                              -webkit-user-select: none !important;
                              user-select: none !important;
                              touch-action: none !important;
                          }

                          /* Notch awareness: buffer primary interactive overlay from Island / Notch */
                          :root {
                              --notch-top: env(safe-area-inset-top, 0px);
                              --notch-left: env(safe-area-inset-left, 0px);
                              --notch-right: env(safe-area-inset-right, 0px);
                          }

                          /* Remove FPS Counter */
                          #fps, .fps, [id*="fps" i] {
                              display: none !important;
                              visibility: hidden !important;
                              opacity: 0 !important;
                              pointer-events: none !important;
                          }

                          /* Remove DodecaDragons Navigation Arrows */
                          #arrowUp, #arrowDown, #arrowLeft, #arrowRight,
                          img[src*="arrowUp"], img[src*="arrowDown"], img[src*="arrowLeft"], img[src*="arrowRight"] {
                              display: none !important;
                              visibility: hidden !important;
                              pointer-events: none !important;
                          }

                          /* Notch-aware smaller Home button strictly locked to the upper-left */
                          #home, img#home, [onclick*="posSet(0,0)"] {
                              position: fixed !important;
                              top: max(8px, env(safe-area-inset-top)) !important;
                              left: max(8px, env(safe-area-inset-left)) !important;
                              width: 26px !important;
                              height: 26px !important;
                              min-width: 26px !important;
                              min-height: 26px !important;
                              max-width: 26px !important;
                              max-height: 26px !important;
                              z-index: 2147483647 !important;
                              margin: 0 !important;
                              padding: 0 !important;
                              display: block !important;
                              visibility: visible !important;
                              opacity: 0.85 !important;
                              transform: none !important;
                              zoom: 1 !important;
                              filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5)) !important;
                          }

                          /* Windows rendered cleanly with consistent scaling */
                          .window {
                              zoom: 0.88;
                          }

                          .window-body, textarea, select {
                              touch-action: pan-y !important;
                          }
                      `;
                      document.head.appendChild(style);

                      // 3. Apply Starting Gold (3,000,000) and Fire (2,000)
                      function applyStartingResources(force) {
                          if (typeof game === 'undefined' || typeof ExpantaNum === 'undefined') {
                              setTimeout(function() { applyStartingResources(force); }, 100);
                              return;
                          }
                          var alreadyInitialized = localStorage.getItem('ios_starter_boost_applied');
                          if (force || !alreadyInitialized) {
                              if (game.gold && game.gold.lt(3000000)) {
                                  game.gold = new ExpantaNum(3000000);
                              }
                              if (game.fire && game.fire.lt(2000)) {
                                  game.fire = new ExpantaNum(2000);
                              }
                              if (typeof game.unlocks !== 'undefined' && game.unlocks < 1) {
                                  game.unlocks = 1;
                              }
                              localStorage.setItem('ios_starter_boost_applied', 'true');
                              if (typeof save === 'function') save();
                          }
                      }

                      // 4. Pinch-to-scale and single-finger camera pan
                      var currentScale = 1.0;
                      var startDist = 0;
                      var startScale = 1.0;
                      var isPanning = false;
                      var lastX = 0, lastY = 0;
                      var accumDX = 0, accumDY = 0;

                      function applyWindowScale(scale) {
                          currentScale = Math.min(Math.max(scale, 0.45), 2.2);
                          var zoomVal = (0.88 * currentScale).toFixed(3);
                          var dynStyle = document.getElementById('dynamic-window-zoom');
                          if (!dynStyle) {
                              dynStyle = document.createElement('style');
                              dynStyle.id = 'dynamic-window-zoom';
                              document.head.appendChild(dynStyle);
                          }
                          dynStyle.textContent = '.window { zoom: ' + zoomVal + ' !important; }';
                      }

                      function getTouchDist(t1, t2) {
                          var dx = t1.clientX - t2.clientX;
                          var dy = t1.clientY - t2.clientY;
                          return Math.hypot(dx, dy);
                      }

                      document.addEventListener('touchstart', function(e) {
                          if (e.touches.length === 2) {
                              isPanning = false;
                              startDist = getTouchDist(e.touches[0], e.touches[1]);
                              startScale = currentScale;
                              return;
                          }
                          if (e.touches.length === 1) {
                              var tag = e.target.tagName ? e.target.tagName.toLowerCase() : '';
                              if (tag === 'button' || tag === 'input' || tag === 'a' || tag === 'select' || e.target.onclick || e.target.closest('button')) {
                                  isPanning = false;
                                  return;
                              }
                              isPanning = true;
                              lastX = e.touches[0].clientX;
                              lastY = e.touches[0].clientY;
                              accumDX = 0;
                              accumDY = 0;
                          }
                      }, { passive: true });

                      document.addEventListener('touchmove', function(e) {
                          if (e.touches.length === 2 && startDist > 0) {
                              var newDist = getTouchDist(e.touches[0], e.touches[1]);
                              var ratio = newDist / startDist;
                              applyWindowScale(startScale * ratio);
                              return;
                          }
                          if (isPanning && e.touches.length === 1) {
                              var dx = e.touches[0].clientX - lastX;
                              var dy = e.touches[0].clientY - lastY;
                              lastX = e.touches[0].clientX;
                              lastY = e.touches[0].clientY;

                              if (typeof xPos !== 'undefined' && typeof yPos !== 'undefined') {
                                  xPos -= dx / currentScale;
                                  yPos -= dy / currentScale;
                              } else if (typeof posMove === 'function') {
                                  accumDX += dx;
                                  accumDY += dy;
                                  var threshold = 110;
                                  if (accumDX > threshold) { posMove(3); accumDX = 0; }
                                  else if (accumDX < -threshold) { posMove(4); accumDX = 0; }
                                  if (accumDY > threshold) { posMove(1); accumDY = 0; }
                                  else if (accumDY < -threshold) { posMove(2); accumDY = 0; }
                              }
                          }
                      }, { passive: true });

                      document.addEventListener('touchend', function(e) {
                          if (e.touches.length < 2) startDist = 0;
                          if (e.touches.length === 0) isPanning = false;
                      }, { passive: true });

                      window.addEventListener('load', function() {
                          applyStartingResources(false);
                          if (typeof window.reset === 'function') {
                              var origReset = window.reset;
                              window.reset = function() {
                                  origReset.apply(this, arguments);
                                  applyStartingResources(true);
                              };
                          }
                      });
                  })();
                  """

                  let userScript = WKUserScript(
                      source: enhancementsScript,
                      injectionTime: .atDocumentEnd,
                      forMainFrameOnly: true
                  )
                  config.userContentController.addUserScript(userScript)

                  let webView = WKWebView(frame: screenBounds, configuration: config)
                  self.webView = webView
                  webView.uiDelegate = self
                  webView.scrollView.delegate = self
                  webView.contentScaleFactor = UIScreen.main.scale
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 0.13, green: 0.13, blue: 0.13, alpha: 1.0)

                  // Allow WebView to stretch edge-to-edge under the Dynamic Island
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.scrollView.insetsLayoutMarginsFromSafeArea = false
                  webView.insetsLayoutMarginsFromSafeArea = false
                  webView.scrollView.isScrollEnabled = false
                  webView.scrollView.bounces = false
                  webView.scrollView.bouncesZoom = false
                  webView.scrollView.minimumZoomScale = 1.0
                  webView.scrollView.maximumZoomScale = 1.0

                  let rootVC = FullscreenViewController()
                  rootVC.view = webView
                  window.rootViewController = rootVC
                  window.makeKeyAndVisible()

                  if let indexURL = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "WebAssets") {
                      webView.loadFileURL(indexURL, allowingReadAccessTo: indexURL.deletingLastPathComponent())
                  }

                  return true
              }

              func viewForZooming(in scrollView: UIScrollView) -> UIView? {
                  return nil
              }

              private func topViewController() -> UIViewController? {
                  var top = window?.rootViewController
                  while let presented = top?.presentedViewController {
                      top = presented
                  }
                  return top
              }

              func webView(_ webView: WKWebView, runJavaScriptAlertPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping () -> Void) {
                  let alert = UIAlertController(title: "DodecaDragons", message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "OK", style: .default) { _ in completionHandler() })
                  topViewController()?.present(alert, animated: true)
              }

              func webView(_ webView: WKWebView, runJavaScriptConfirmPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (Bool) -> Void) {
                  let alert = UIAlertController(title: "Confirm", message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "Cancel", style: .cancel) { _ in completionHandler(false) })
                  alert.addAction(UIAlertAction(title: "OK", style: .destructive) { _ in completionHandler(true) })
                  topViewController()?.present(alert, animated: true)
              }

              func webView(_ webView: WKWebView, runJavaScriptTextInputPanelWithPrompt prompt: String, defaultText: String?, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (String?) -> Void) {
                  let alert = UIAlertController(title: prompt, message: nil, preferredStyle: .alert)
                  alert.addTextField { textField in
                      textField.text = defaultText
                      textField.placeholder = "Paste save data..."
                  }
                  alert.addAction(UIAlertAction(title: "Cancel", style: .cancel) { _ in completionHandler(nil) })
                  alert.addAction(UIAlertAction(title: "Import", style: .default) { _ in
                      completionHandler(alert.textFields?.first?.text)
                  })
                  topViewController()?.present(alert, animated: true)
              }
          }

          UIApplicationMain(
              CommandLine.argc,
              CommandLine.unsafeArgv,
              nil,
              NSStringFromClass(AppDelegate.self)
          )
          EOF

          # 2. Direct Swift compilation
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -O \
            -o "$APP_DIR/DodecaDragons" \
            main.swift

          # 3. Write Info.plist
          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DodecaDragons</string>
              <key>CFBundleIdentifier</key>
              <string>com.demonin.dodecadragons</string>
              <key>CFBundleName</key>
              <string>DodecaDragons</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.4</string>
              <key>CFBundleVersion</key>
              <string>5</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UIStatusBarHidden</key>
              <true/>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # 4. Sign binary for TrollStore/Jailbreak bypass
          brew install dpkg ldid
          ldid -S "$APP_DIR/DodecaDragons"

          # 5. Package as .deb
          mkdir -p deb_root/DEBIAN deb_root/Applications
          cp -r "$APP_DIR" deb_root/Applications/
          cat << 'EOF' > deb_root/DEBIAN/control
          Package: com.demonin.dodecadragons
          Name: DodecaDragons
          Version: 1.0.4
          Architecture: iphoneos-arm64
          Description: DodecaDragons native iOS port - Notch Aware Top-Left Mini Home
          Maintainer: Demonin
          Author: Demonin
          Section: Games
          EOF
          chmod 755 deb_root/DEBIAN
          dpkg-deb -Zxz --build deb_root DodecaDragons_1.0.4_iphoneos-arm64.deb

          # 6. Package as .ipa
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r9 DodecaDragons.ipa Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DodecaDragons-Builds
          path: |
            DodecaDragons_1.0.4_iphoneos-arm64.deb
            DodecaDragons.ipa
