name: Build DodecaDragons DEB and IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Build App with Notch-Aligned Gold & Resources Window
        run: |
          APP_DIR="DodecaDragons.app"
          mkdir -p "$APP_DIR/WebAssets"

          # Copy web assets
          cp -r index.html style.css 98.css changelog.txt savebank.txt fonts img scripts "$APP_DIR/WebAssets/" 2>/dev/null || true

          # Patch scripts for 3,000,000 starting gold & 2,000 fire
          for f in "$APP_DIR/WebAssets/scripts/"*.js; do
            if [ -f "$f" ]; then
              sed -i '' 's/gold: new ExpantaNum(0)/gold: new ExpantaNum(3000000)/g' "$f" 2>/dev/null || true
              sed -i '' 's/gold:new ExpantaNum(0)/gold:new ExpantaNum(3000000)/g' "$f" 2>/dev/null || true
              sed -i '' 's/fire: new ExpantaNum(0)/fire: new ExpantaNum(2000)/g' "$f" 2>/dev/null || true
              sed -i '' 's/fire:new ExpantaNum(0)/fire:new ExpantaNum(2000)/g' "$f" 2>/dev/null || true
            fi
          done

          # 1. Write Native Swift Source
          cat << 'EOF' > main.swift
          import UIKit
          import WebKit

          class FullscreenViewController: UIViewController {
              override var prefersStatusBarHidden: Bool { true }
              override var prefersHomeIndicatorAutoHidden: Bool { true }
              override var preferredScreenEdgesDeferringSystemGestures: UIRectEdge { .all }
          }

          class AppDelegate: UIResponder, UIApplicationDelegate, WKUIDelegate, UIScrollViewDelegate {
              var window: UIWindow?
              var webView: WKWebView?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let screenBounds = UIScreen.main.bounds
                  let window = UIWindow(frame: screenBounds)
                  window.contentScaleFactor = UIScreen.main.scale
                  self.window = window

                  let config = WKWebViewConfiguration()
                  config.websiteDataStore = .default()
                  config.preferences.javaScriptCanOpenWindowsAutomatically = true

                  let enhancementsScript = """
                  (function() {
                      var meta = document.querySelector('meta[name="viewport"]');
                      if (!meta) {
                          meta = document.createElement('meta');
                          meta.name = 'viewport';
                          document.head.appendChild(meta);
                      }
                      meta.content = 'width=1280, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';

                      // Preserve exact original DOM collection order for .box and .window so moving the Resources
                      // window never shifts DodecaDragons' internal tab indices
                      var cachedBoxes = null;
                      var cachedWindows = null;
                      var origGetByClass = document.getElementsByClassName.bind(document);
                      document.getElementsByClassName = function(name) {
                          if ((name === 'box' || name === 'window box' || name === 'box window') && cachedBoxes && cachedBoxes.length > 0) {
                              return cachedBoxes;
                          }
                          if (name === 'window' && cachedWindows && cachedWindows.length > 0) {
                              return cachedWindows;
                          }
                          return origGetByClass(name);
                      };

                      var style = document.createElement('style');
                      style.textContent = `
                          html, body {
                              position: fixed !important;
                              top: 0 !important;
                              left: 0 !important;
                              width: 100vw !important;
                              height: 100vh !important;
                              margin: 0 !important;
                              padding: 0 !important;
                              overflow: hidden !important;
                              background-color: #1a1a1a !important;
                              transform: none !important;
                              -webkit-user-select: none !important;
                              user-select: none !important;
                              touch-action: none !important;
                              -webkit-text-size-adjust: none !important;
                              text-size-adjust: none !important;
                          }

                          /* Scaling board wrapper for game windows (Preserves original pixel font) */
                          #ios-board-wrapper {
                              position: absolute !important;
                              top: 0 !important;
                              left: 0 !important;
                              width: 100vw !important;
                              height: 100vh !important;
                              margin: 0 !important;
                              padding: 0 !important;
                              transform-origin: 50% 50% !important;
                              transform: scale(0.88) !important;
                              z-index: 1 !important;
                              pointer-events: auto !important;
                          }

                          #ios-board-wrapper > div:not(.window) {
                              position: absolute !important;
                              top: 0 !important;
                              left: 0 !important;
                              width: 100vw !important;
                              height: 100vh !important;
                              pointer-events: none !important;
                          }

                          #ios-board-wrapper .window {
                              pointer-events: auto !important;
                          }

                          /* Force ALL clickable text (buttons, disabled/unaffordable buttons, links, clickable rows) to solid BLACK */
                          button,
                          button:disabled,
                          button[disabled],
                          button:active,
                          button:hover,
                          button:focus,
                          button *,
                          a, a:link, a:visited, a:hover, a:active, a *,
                          [onclick]:not(.window),
                          [onclick]:not(.window) *,
                          [style*="color: blue" i],
                          [style*="color:blue" i],
                          [style*="color: #00f" i],
                          [style*="color:#00f" i],
                          [style*="color: #0000ff" i],
                          [style*="color:#0000ff" i],
                          [style*="color: rgb(0, 0, 255)" i],
                          font[color="blue" i],
                          font[color="#0000ff" i] {
                              color: #000000 !important;
                              -webkit-text-fill-color: #000000 !important;
                              text-shadow: none !important;
                          }

                          /* Keep window title bar text white as in original UI */
                          .title-bar-text {
                              color: #ffffff !important;
                              -webkit-text-fill-color: #ffffff !important;
                          }

                          /* Hide FPS, Navigation Arrows, Visible Home Button, and Achievement Unlocked Box */
                          #fps, .fps, [id*="fps" i],
                          #arrowUp, #arrowDown, #arrowLeft, #arrowRight,
                          img[src*="arrowUp"], img[src*="arrowDown"], img[src*="arrowLeft"], img[src*="arrowRight"],
                          #home, img#home, img[src*="home" i], [onclick*="posSet(0,0)"], #ios-fixed-home-btn,
                          .ios-hidden-achievement-box {
                              display: none !important;
                              visibility: hidden !important;
                              opacity: 0 !important;
                              pointer-events: none !important;
                          }

                          /* Top-Left Menu Bars (Resources, Settings, Achievements, Info/credits) fixed BELOW the notch height */
                          #ios-fixed-top-menu {
                              position: fixed !important;
                              top: max(52px, calc(env(safe-area-inset-top, 48px) + 4px)) !important;
                              left: max(6px, env(safe-area-inset-left, 6px)) !important;
                              z-index: 2147483647 !important;
                              display: flex !important;
                              flex-wrap: wrap !important;
                              gap: 4px !important;
                              width: 260px !important;
                              pointer-events: none !important;
                              transform: none !important;
                          }

                          #ios-fixed-top-menu > button {
                              pointer-events: auto !important;
                              margin: 0 !important;
                          }

                          /* Gold Counter directly to the LEFT of the notch at the notch's exact vertical height */
                          #custom-ios-gold {
                              position: fixed !important;
                              top: 12px !important;
                              right: calc(50% + 210px) !important;
                              left: auto !important;
                              background: #c0c0c0 !important;
                              border: 2px outset #ffffff !important;
                              padding: 3px 6px !important;
                              font-size: 11px !important;
                              font-weight: normal !important;
                              color: #000000 !important;
                              z-index: 2147483647 !important;
                              box-shadow: 2px 2px 5px rgba(0,0,0,0.5) !important;
                              pointer-events: none !important;
                              white-space: nowrap !important;
                              transform: none !important;
                          }

                          /* Resources Window fixed in place to the RIGHT of the notch */
                          .ios-fixed-resources-window {
                              position: fixed !important;
                              top: 12px !important;
                              left: calc(50% + 210px) !important;
                              right: auto !important;
                              transform: none !important;
                              zoom: 1 !important;
                              z-index: 2147483646 !important;
                              pointer-events: auto !important;
                          }
                      `;
                      document.head.appendChild(style);

                      // Create Unscaled Root Overlays on document.documentElement
                      var topMenuContainer = document.createElement('div');
                      topMenuContainer.id = 'ios-fixed-top-menu';
                      document.documentElement.appendChild(topMenuContainer);

                      var goldBox = document.createElement('div');
                      goldBox.id = 'custom-ios-gold';
                      goldBox.innerText = 'Gold: 0';
                      document.documentElement.appendChild(goldBox);

                      function organizeDOM() {
                          if (!cachedBoxes) {
                              var b = origGetByClass('box');
                              if (b && b.length > 0) cachedBoxes = Array.from(b);
                          }
                          if (!cachedWindows) {
                              var w = origGetByClass('window');
                              if (w && w.length > 0) cachedWindows = Array.from(w);
                          }

                          var board = document.getElementById('ios-board-wrapper');
                          if (!board) {
                              board = document.createElement('div');
                              board.id = 'ios-board-wrapper';
                              document.body.appendChild(board);
                          }

                          // 1. Move body children into the scaling board
                          var bodyChildren = Array.from(document.body.children);
                          for (var i = 0; i < bodyChildren.length; i++) {
                              var el = bodyChildren[i];
                              if (
                                  el.id === 'ios-board-wrapper' ||
                                  el.classList.contains('ios-fixed-resources-window') ||
                                  el.tagName === 'SCRIPT' ||
                                  el.tagName === 'STYLE'
                              ) {
                                  continue;
                              }
                              board.appendChild(el);
                          }

                          // 2. Put top menu buttons (Resources, Settings, Achievements, Info/credits) into the fixed top-left container
                          var looseButtons = Array.from(board.querySelectorAll('button'));
                          for (var j = 0; j < looseButtons.length; j++) {
                              var btn = looseButtons[j];
                              if (!btn.closest('.window') && btn.parentElement !== topMenuContainer) {
                                  topMenuContainer.appendChild(btn);
                              }
                          }

                          // 3. Locate the "Resources" window and the "Achievement unlocked!" box
                          var allWindows = cachedWindows || Array.from(document.querySelectorAll('.window'));
                          for (var k = 0; k < allWindows.length; k++) {
                              var win = allWindows[k];
                              var titleEl = win.querySelector('.title-bar-text');
                              var titleText = titleEl ? (titleEl.textContent || '').trim().toLowerCase() : '';

                              // Fix the "Resources" window to the right of the notch (outside #ios-board-wrapper)
                              if (titleText === 'resources') {
                                  win.classList.add('ios-fixed-resources-window');
                                  if (win.parentElement !== document.body) {
                                      document.body.appendChild(win);
                                  }
                              }

                              // Completely remove/hide the "Achievement unlocked!" popup box
                              if (titleText.indexOf('achievement unlocked') !== -1) {
                                  win.classList.add('ios-hidden-achievement-box');
                              }
                          }
                      }

                      if (document.readyState === 'loading') {
                          document.addEventListener('DOMContentLoaded', organizeDOM);
                      } else {
                          organizeDOM();
                      }

                      // Update Gold Counter & ensure clickable/blue text stays black
                      setInterval(function() {
                          if (typeof game !== 'undefined' && game.gold && typeof format === 'function') {
                              goldBox.innerText = 'Gold: ' + format(game.gold);
                          }
                      }, 100);

                      function enforceBlackClickableText() {
                          var elements = document.querySelectorAll('button, button *, a, a *, [onclick]:not(.window), .window-body span, .window-body p, .window-body b, .window-body font');
                          for (var i = 0; i < elements.length; i++) {
                              var el = elements[i];
                              if (el.classList && el.classList.contains('title-bar-text')) continue;
                              if (el.closest && el.closest('.title-bar')) continue;

                              var tag = el.tagName ? el.tagName.toLowerCase() : '';
                              if (tag === 'button' || tag === 'a' || el.closest('button') || el.closest('a') || el.hasAttribute('onclick')) {
                                  el.style.setProperty('color', '#000000', 'important');
                                  el.style.setProperty('-webkit-text-fill-color', '#000000', 'important');
                                  el.style.setProperty('text-shadow', 'none', 'important');
                                  continue;
                              }

                              var c = window.getComputedStyle(el).color;
                              var m = c.match(/rgb\\((\\d+),\\s*(\\d+),\\s*(\\d+)\\)/);
                              if (m) {
                                  var r = parseInt(m[1], 10), g = parseInt(m[2], 10), b = parseInt(m[3], 10);
                                  if (b > 150 && r < 100 && g < 100) {
                                      el.style.setProperty('color', '#000000', 'important');
                                      el.style.setProperty('text-shadow', 'none', 'important');
                                  }
                              }
                          }
                      }
                      setInterval(enforceBlackClickableText, 400);

                      // Starting Resources
                      function applyStartingResources(force) {
                          if (typeof game === 'undefined' || typeof ExpantaNum === 'undefined') {
                              setTimeout(function() { applyStartingResources(force); }, 100);
                              return;
                          }
                          var alreadyInitialized = localStorage.getItem('ios_starter_boost_applied');
                          if (force || !alreadyInitialized) {
                              if (game.gold && game.gold.lt(3000000)) game.gold = new ExpantaNum(3000000);
                              if (game.fire && game.fire.lt(2000)) game.fire = new ExpantaNum(2000);
                              if (typeof game.unlocks !== 'undefined' && game.unlocks < 1) game.unlocks = 1;
                              localStorage.setItem('ios_starter_boost_applied', 'true');
                              if (typeof save === 'function') save();
                          }
                      }

                      // Camera / Zoom Controller (Scales #ios-board-wrapper ONLY)
                      var currentScale = 1.0;
                      var startDist = 0, startScale = 1.0;
                      var isPanning = false, lastX = 0, lastY = 0, accumDX = 0, accumDY = 0;

                      function applyBoardScale(scale) {
                          currentScale = Math.min(Math.max(scale, 0.35), 2.5);
                          var finalScale = (0.88 * currentScale).toFixed(3);
                          var board = document.getElementById('ios-board-wrapper');
                          if (board) {
                              board.style.setProperty('transform', 'scale(' + finalScale + ')', 'important');
                          }
                      }

                      function getTouchDist(t1, t2) {
                          return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                      }

                      // Invisible Top-Right Double-Tap to Reset Camera & Zoom
                      var lastTopRightTapTime = 0;
                      document.addEventListener('touchend', function(e) {
                          var touch = e.changedTouches && e.changedTouches[0];
                          if (!touch) return;
                          if (touch.clientX >= window.innerWidth - 120 && touch.clientY <= 100) {
                              var now = Date.now();
                              if (now - lastTopRightTapTime < 350) {
                                  if (typeof posSet === 'function') posSet(0, 0);
                                  if (typeof xPos !== 'undefined') xPos = 0;
                                  if (typeof yPos !== 'undefined') yPos = 0;
                                  applyBoardScale(1.0);
                                  lastTopRightTapTime = 0;
                                  return;
                              }
                              lastTopRightTapTime = now;
                          }
                      }, { passive: true });

                      document.addEventListener('touchstart', function(e) {
                          if (e.touches.length === 2) {
                              isPanning = false;
                              startDist = getTouchDist(e.touches[0], e.touches[1]);
                              startScale = currentScale;
                          } else if (e.touches.length === 1) {
                              var tag = e.target.tagName ? e.target.tagName.toLowerCase() : '';
                              if (
                                  tag === 'button' ||
                                  tag === 'input' ||
                                  tag === 'a' ||
                                  tag === 'select' ||
                                  e.target.onclick ||
                                  e.target.closest('button') ||
                                  e.target.closest('#ios-fixed-top-menu') ||
                                  e.target.closest('.ios-fixed-resources-window')
                              ) {
                                  isPanning = false;
                                  return;
                              }
                              isPanning = true;
                              lastX = e.touches[0].clientX;
                              lastY = e.touches[0].clientY;
                              accumDX = 0;
                              accumDY = 0;
                          }
                      }, { passive: true });

                      document.addEventListener('touchmove', function(e) {
                          if (e.touches.length === 2 && startDist > 0) {
                              applyBoardScale(startScale * (getTouchDist(e.touches[0], e.touches[1]) / startDist));
                          } else if (isPanning && e.touches.length === 1) {
                              var dx = e.touches[0].clientX - lastX;
                              var dy = e.touches[0].clientY - lastY;
                              lastX = e.touches[0].clientX;
                              lastY = e.touches[0].clientY;

                              var effectiveScale = 0.88 * currentScale;
                              if (typeof xPos !== 'undefined' && typeof yPos !== 'undefined') {
                                  xPos -= dx / effectiveScale;
                                  yPos -= dy / effectiveScale;
                              } else if (typeof posMove === 'function') {
                                  accumDX += dx;
                                  accumDY += dy;
                                  var threshold = 110;
                                  if (accumDX > threshold) { posMove(3); accumDX = 0; }
                                  else if (accumDX < -threshold) { posMove(4); accumDX = 0; }
                                  if (accumDY > threshold) { posMove(1); accumDY = 0; }
                                  else if (accumDY < -threshold) { posMove(2); accumDY = 0; }
                              }
                          }
                      }, { passive: true });

                      document.addEventListener('touchend', function(e) {
                          if (e.touches.length < 2) startDist = 0;
                          if (e.touches.length === 0) isPanning = false;
                      }, { passive: true });

                      document.addEventListener("visibilitychange", function() {
                          if (document.hidden && typeof save === 'function') save();
                      });
                      window.addEventListener('pagehide', function() {
                          if (typeof save === 'function') save();
                      });

                      window.addEventListener('load', function() {
                          organizeDOM();
                          setTimeout(organizeDOM, 300);
                          applyStartingResources(false);
                          enforceBlackClickableText();
                          if (typeof window.reset === 'function') {
                              var origReset = window.reset;
                              window.reset = function() {
                                  origReset.apply(this, arguments);
                                  applyStartingResources(true);
                              };
                          }
                      });
                  })();
                  """

                  let userScript = WKUserScript(source: enhancementsScript, injectionTime: .atDocumentEnd, forMainFrameOnly: true)
                  config.userContentController.addUserScript(userScript)

                  let webView = WKWebView(frame: screenBounds, configuration: config)
                  self.webView = webView
                  webView.uiDelegate = self
                  webView.scrollView.delegate = self
                  webView.contentScaleFactor = UIScreen.main.scale
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.isOpaque = false
                  webView.backgroundColor = .black

                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.scrollView.insetsLayoutMarginsFromSafeArea = false
                  webView.insetsLayoutMarginsFromSafeArea = false
                  webView.scrollView.isScrollEnabled = false
                  webView.scrollView.bounces = false
                  webView.scrollView.bouncesZoom = false
                  webView.scrollView.minimumZoomScale = 1.0
                  webView.scrollView.maximumZoomScale = 1.0

                  let rootVC = FullscreenViewController()
                  rootVC.view = webView
                  window.rootViewController = rootVC
                  window.makeKeyAndVisible()

                  if let indexURL = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "WebAssets") {
                      webView.loadFileURL(indexURL, allowingReadAccessTo: indexURL.deletingLastPathComponent())
                  }

                  return true
              }

              func applicationWillResignActive(_ application: UIApplication) {
                  webView?.evaluateJavaScript("if (typeof save === 'function') save();", completionHandler: nil)
              }

              func applicationDidEnterBackground(_ application: UIApplication) {
                  webView?.evaluateJavaScript("if (typeof save === 'function') save();", completionHandler: nil)
              }

              func viewForZooming(in scrollView: UIScrollView) -> UIView? { return nil }

              private func topViewController() -> UIViewController? {
                  var top = window?.rootViewController
                  while let presented = top?.presentedViewController { top = presented }
                  return top
              }

              func webView(_ webView: WKWebView, runJavaScriptAlertPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping () -> Void) {
                  let alert = UIAlertController(title: "DodecaDragons", message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "OK", style: .default) { _ in completionHandler() })
                  topViewController()?.present(alert, animated: true)
              }

              func webView(_ webView: WKWebView, runJavaScriptConfirmPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (Bool) -> Void) {
                  let alert = UIAlertController(title: "Confirm", message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "Cancel", style: .cancel) { _ in completionHandler(false) })
                  alert.addAction(UIAlertAction(title: "OK", style: .destructive) { _ in completionHandler(true) })
                  topViewController()?.present(alert, animated: true)
              }

              func webView(_ webView: WKWebView, runJavaScriptTextInputPanelWithPrompt prompt: String, defaultText: String?, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (String?) -> Void) {
                  let alert = UIAlertController(title: prompt, message: nil, preferredStyle: .alert)
                  alert.addTextField { tf in tf.text = defaultText; tf.placeholder = "Paste save data..." }
                  alert.addAction(UIAlertAction(title: "Cancel", style: .cancel) { _ in completionHandler(nil) })
                  alert.addAction(UIAlertAction(title: "Import", style: .default) { _ in completionHandler(alert.textFields?.first?.text) })
                  topViewController()?.present(alert, animated: true)
              }
          }

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EOF

          # 2. Compile directly with Swiftc
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -O \
            -o "$APP_DIR/DodecaDragons" \
            main.swift

          # 3. Write Info.plist
          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DodecaDragons</string>
              <key>CFBundleIdentifier</key>
              <string>com.demonin.dodecadragons</string>
              <key>CFBundleName</key>
              <string>DodecaDragons</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.2.2</string>
              <key>CFBundleVersion</key>
              <string>23</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UILaunchScreen</key><dict/>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIStatusBarHidden</key><true/>
              <key>UIViewControllerBasedStatusBarAppearance</key><true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # 4. Sign binary
          brew install dpkg ldid
          ldid -S "$APP_DIR/DodecaDragons"

          # 5. Package as .deb
          mkdir -p deb_root/DEBIAN deb_root/Applications
          cp -r "$APP_DIR" deb_root/Applications/
          cat << 'EOF' > deb_root/DEBIAN/control
          Package: com.demonin.dodecadragons
          Name: DodecaDragons
          Version: 1.2.2
          Architecture: iphoneos-arm64
          Description: DodecaDragons native iOS port - Notch-Aligned Gold & Fixed Resources Window
          Maintainer: Demonin
          Author: Demonin
          Section: Games
          EOF
          chmod 755 deb_root/DEBIAN
          dpkg-deb -Zxz --build deb_root DodecaDragons_1.2.2_iphoneos-arm64.deb

          # 6. Package as .ipa
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r9 DodecaDragons.ipa Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DodecaDragons-Builds
          path: |
            DodecaDragons_1.2.2_iphoneos-arm64.deb
            DodecaDragons.ipa
