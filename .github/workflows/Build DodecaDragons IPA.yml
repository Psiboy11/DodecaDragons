name: Build DodecaDragons DEB and IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Patch Game Source Code (Hardcode 300k Gold, 3k Fire & Root HUD)
        run: |
          APP_DIR="DodecaDragons.app"
          mkdir -p "$APP_DIR/WebAssets"

          # Copy web assets
          cp -r index.html style.css 98.css changelog.txt savebank.txt fonts img scripts "$APP_DIR/WebAssets/" 2>/dev/null || true

          # Direct Python patch to guarantee initial resource state in JS files
          python3 - << 'PYEOF'
          import os, re

          web_dir = "DodecaDragons.app/WebAssets"
          scripts_dir = os.path.join(web_dir, "scripts")

          # 1. Patch JavaScript game files
          if os.path.exists(scripts_dir):
              for root, _, files in os.walk(scripts_dir):
                  for file in files:
                      if file.endswith(".js"):
                          path = os.path.join(root, file)
                          with open(path, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()

                          # Replace gold and fire initializations
                          content = re.sub(r'gold\s*:\s*new\s+ExpantaNum\(0\)', 'gold: new ExpantaNum(300000)', content)
                          content = re.sub(r'fire\s*:\s*new\s+ExpantaNum\(0\)', 'fire: new ExpantaNum(3000)', content)
                          content = re.sub(r'game\.gold\s*=\s*new\s+ExpantaNum\(0\)', 'game.gold = new ExpantaNum(300000)', content)
                          content = re.sub(r'game\.fire\s*=\s*new\s+ExpantaNum\(0\)', 'game.fire = new ExpantaNum(3000)', content)

                          with open(path, "w", encoding="utf-8") as f:
                              f.write(content)

          # 2. Inject starter save override directly into index.html
          index_path = os.path.join(web_dir, "index.html")
          if os.path.exists(index_path):
              with open(index_path, "r", encoding="utf-8", errors="ignore") as f:
                  html = f.read()

              init_script = """
              <script>
              (function() {
                  // Clear outdated empty saves so 300k gold & 3k fire take effect immediately
                  try {
                      var key = 'dodecaDragonsSave';
                      var raw = localStorage.getItem(key);
                      if (raw) {
                          var saveObj = JSON.parse(atob(raw));
                          if (!saveObj.gold || Number(saveObj.gold) < 300000) {
                              localStorage.removeItem(key);
                          }
                      }
                  } catch(e) {}
              })();
              </script>
              """
              html = html.replace("<head>", "<head>" + init_script)
              with open(index_path, "w", encoding="utf-8") as f:
                  f.write(html)
          PYEOF

      - name: Build Native Swift App, .deb, and .ipa
        run: |
          APP_DIR="DodecaDragons.app"

          # 1. Write Native Swift Source
          cat << 'EOF' > main.swift
          import UIKit
          import WebKit

          class FullscreenViewController: UIViewController {
              override var prefersStatusBarHidden: Bool { true }
              override var prefersHomeIndicatorAutoHidden: Bool { true }
              override var preferredScreenEdgesDeferringSystemGestures: UIRectEdge { .all }
          }

          class AppDelegate: UIResponder, UIApplicationDelegate, WKUIDelegate, UIScrollViewDelegate {
              var window: UIWindow?
              var webView: WKWebView?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let screenBounds = UIScreen.main.bounds
                  let window = UIWindow(frame: screenBounds)
                  window.contentScaleFactor = UIScreen.main.scale
                  self.window = window

                  let config = WKWebViewConfiguration()
                  config.websiteDataStore = .default()
                  config.preferences.javaScriptCanOpenWindowsAutomatically = true

                  let enhancementsScript = """
                  (function() {
                      // 1. Lock high-DPI viewport
                      var meta = document.querySelector('meta[name="viewport"]');
                      if (!meta) {
                          meta = document.createElement('meta');
                          meta.name = 'viewport';
                          document.head.appendChild(meta);
                      }
                      meta.content = 'width=1280, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';

                      // 2. Base CSS
                      var style = document.createElement('style');
                      style.textContent = `
                          html {
                              background-color: #000 !important;
                              overflow: hidden !important;
                          }

                          body {
                              position: fixed !important;
                              top: env(safe-area-inset-top) !important;
                              left: env(safe-area-inset-left) !important;
                              right: env(safe-area-inset-right) !important;
                              bottom: env(safe-area-inset-bottom) !important;
                              width: auto !important;
                              height: auto !important;
                              margin: 0 !important;
                              padding: 0 !important;
                              overflow: hidden !important;
                              background-color: #1a1a1a !important; 
                              -webkit-user-select: none !important;
                              user-select: none !important;
                              touch-action: none !important;
                          }

                          /* Hide original FPS and navigation arrows */
                          #fps, .fps, [id*="fps" i],
                          #arrowUp, #arrowDown, #arrowLeft, #arrowRight,
                          img[src*="arrowUp"], img[src*="arrowDown"], img[src*="arrowLeft"], img[src*="arrowRight"] {
                              display: none !important;
                              visibility: hidden !important;
                              pointer-events: none !important;
                          }

                          /* Hide any original home buttons to prevent visual ghosting */
                          #home:not(#ios-fixed-home-btn), img#home:not(#ios-fixed-home-btn) {
                              display: none !important;
                          }

                          .window {
                              zoom: 0.88;
                          }

                          .window-body, textarea, select {
                              touch-action: pan-y !important;
                          }

                          /* UI Overlays attached to root HTML */
                          #custom-ios-gold {
                              position: fixed !important;
                              top: max(10px, env(safe-area-inset-top)) !important;
                              left: max(10px, env(safe-area-inset-left)) !important;
                              background: #c0c0c0 !important;
                              border: 2px outset #ffffff !important;
                              padding: 4px 10px !important;
                              font-family: 'Pixelated MS Sans Serif', Arial, sans-serif !important;
                              font-size: 16px !important;
                              font-weight: bold !important;
                              color: #000000 !important;
                              z-index: 2147483647 !important;
                              box-shadow: 2px 2px 6px rgba(0,0,0,0.6) !important;
                              pointer-events: none !important;
                              display: block !important;
                          }

                          #ios-fixed-home-btn {
                              position: fixed !important;
                              top: max(10px, env(safe-area-inset-top)) !important;
                              right: max(10px, env(safe-area-inset-right)) !important;
                              width: 34px !important;
                              height: 34px !important;
                              background: #c0c0c0 !important;
                              border: 2px outset #ffffff !important;
                              box-shadow: 2px 2px 6px rgba(0,0,0,0.6) !important;
                              z-index: 2147483647 !important;
                              display: flex !important;
                              align-items: center !important;
                              justify-content: center !important;
                              cursor: pointer !important;
                              touch-action: manipulation !important;
                          }

                          #ios-fixed-home-btn:active {
                              border: 2px inset #ffffff !important;
                          }
                      `;
                      document.head.appendChild(style);

                      // 3. Inject Overlays directly into DocumentElement so body overflow cannot clip them
                      function setupOverlays() {
                          var root = document.documentElement || document.body;

                          if (!document.getElementById('custom-ios-gold')) {
                              var goldBox = document.createElement('div');
                              goldBox.id = 'custom-ios-gold';
                              goldBox.innerText = 'Gold: 300K';
                              root.appendChild(goldBox);
                          }

                          if (!document.getElementById('ios-fixed-home-btn')) {
                              var homeBtn = document.createElement('div');
                              homeBtn.id = 'ios-fixed-home-btn';
                              homeBtn.title = 'Home (0,0)';
                              // Self-contained inline SVG home icon
                              homeBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#000"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>';
                              homeBtn.onclick = function(e) {
                                  e.preventDefault();
                                  e.stopPropagation();
                                  if (typeof posSet === 'function') {
                                      posSet(0, 0);
                                  }
                                  if (typeof xPos !== 'undefined') xPos = 0;
                                  if (typeof yPos !== 'undefined') yPos = 0;
                              };
                              root.appendChild(homeBtn);
                          }
                      }

                      setupOverlays();
                      window.addEventListener('DOMContentLoaded', setupOverlays);
                      window.addEventListener('load', setupOverlays);

                      // 4. Force In-Memory State Updates
                      function enforceState() {
                          if (typeof game !== 'undefined' && typeof ExpantaNum !== 'undefined') {
                              if (!game.gold || game.gold.lt(300000)) {
                                  game.gold = new ExpantaNum(300000);
                              }
                              if (!game.fire || game.fire.lt(3000)) {
                                  game.fire = new ExpantaNum(3000);
                              }
                              if (typeof game.unlocks !== 'undefined' && game.unlocks < 1) {
                                  game.unlocks = 1;
                              }
                              var goldBox = document.getElementById('custom-ios-gold');
                              if (goldBox && typeof format === 'function') {
                                  goldBox.innerText = 'Gold: ' + format(game.gold);
                              }
                          }
                      }

                      setInterval(enforceState, 150);

                      // 5. Camera Pan & Zoom Controller
                      var currentScale = 1.0;
                      var startDist = 0, startScale = 1.0;
                      var isPanning = false, lastX = 0, lastY = 0, accumDX = 0, accumDY = 0;

                      function applyWindowScale(scale) {
                          currentScale = Math.min(Math.max(scale, 0.45), 2.2);
                          var zoomVal = (0.88 * currentScale).toFixed(3);
                          var dynStyle = document.getElementById('dynamic-window-zoom');
                          if (!dynStyle) {
                              dynStyle = document.createElement('style');
                              dynStyle.id = 'dynamic-window-zoom';
                              document.head.appendChild(dynStyle);
                          }
                          dynStyle.textContent = '.window { zoom: ' + zoomVal + ' !important; }';
                      }

                      function getTouchDist(t1, t2) {
                          return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                      }

                      document.addEventListener('touchstart', function(e) {
                          if (e.touches.length === 2) {
                              isPanning = false;
                              startDist = getTouchDist(e.touches[0], e.touches[1]);
                              startScale = currentScale;
                          } else if (e.touches.length === 1) {
                              var tag = e.target.tagName ? e.target.tagName.toLowerCase() : '';
                              if (tag === 'button' || tag === 'input' || tag === 'a' || tag === 'select' || e.target.onclick || e.target.closest('button') || e.target.closest('#ios-fixed-home-btn')) {
                                  isPanning = false;
                                  return;
                              }
                              isPanning = true;
                              lastX = e.touches[0].clientX;
                              lastY = e.touches[0].clientY;
                              accumDX = 0;
                              accumDY = 0;
                          }
                      }, { passive: true });

                      document.addEventListener('touchmove', function(e) {
                          if (e.touches.length === 2 && startDist > 0) {
                              applyWindowScale(startScale * (getTouchDist(e.touches[0], e.touches[1]) / startDist));
                          } else if (isPanning && e.touches.length === 1) {
                              var dx = e.touches[0].clientX - lastX;
                              var dy = e.touches[0].clientY - lastY;
                              lastX = e.touches[0].clientX;
                              lastY = e.touches[0].clientY;

                              if (typeof xPos !== 'undefined' && typeof yPos !== 'undefined') {
                                  xPos -= dx / currentScale;
                                  yPos -= dy / currentScale;
                              } else if (typeof posMove === 'function') {
                                  accumDX += dx;
                                  accumDY += dy;
                                  var threshold = 110;
                                  if (accumDX > threshold) { posMove(3); accumDX = 0; }
                                  else if (accumDX < -threshold) { posMove(4); accumDX = 0; }
                                  if (accumDY > threshold) { posMove(1); accumDY = 0; }
                                  else if (accumDY < -threshold) { posMove(2); accumDY = 0; }
                              }
                          }
                      }, { passive: true });

                      document.addEventListener('touchend', function(e) {
                          if (e.touches.length < 2) startDist = 0;
                          if (e.touches.length === 0) isPanning = false;
                      }, { passive: true });
                  })();
                  """

                  let userScript = WKUserScript(source: enhancementsScript, injectionTime: .atDocumentEnd, forMainFrameOnly: true)
                  config.userContentController.addUserScript(userScript)

                  let webView = WKWebView(frame: screenBounds, configuration: config)
                  self.webView = webView
                  webView.uiDelegate = self
                  webView.scrollView.delegate = self
                  webView.contentScaleFactor = UIScreen.main.scale
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.isOpaque = false
                  webView.backgroundColor = .black

                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.scrollView.insetsLayoutMarginsFromSafeArea = false
                  webView.insetsLayoutMarginsFromSafeArea = false
                  webView.scrollView.isScrollEnabled = false
                  webView.scrollView.bounces = false
                  webView.scrollView.bouncesZoom = false
                  webView.scrollView.minimumZoomScale = 1.0
                  webView.scrollView.maximumZoomScale = 1.0

                  let rootVC = FullscreenViewController()
                  rootVC.view = webView
                  window.rootViewController = rootVC
                  window.makeKeyAndVisible()

                  if let indexURL = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "WebAssets") {
                      webView.loadFileURL(indexURL, allowingReadAccessTo: indexURL.deletingLastPathComponent())
                  }

                  return true
              }

              func viewForZooming(in scrollView: UIScrollView) -> UIView? { return nil }

              private func topViewController() -> UIViewController? {
                  var top = window?.rootViewController
                  while let presented = top?.presentedViewController { top = presented }
                  return top
              }

              func webView(_ webView: WKWebView, runJavaScriptAlertPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping () -> Void) {
                  let alert = UIAlertController(title: "DodecaDragons", message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "OK", style: .default) { _ in completionHandler() })
                  topViewController()?.present(alert, animated: true)
              }

              func webView(_ webView: WKWebView, runJavaScriptConfirmPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (Bool) -> Void) {
                  let alert = UIAlertController(title: "Confirm", message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "Cancel", style: .cancel) { _ in completionHandler(false) })
                  alert.addAction(UIAlertAction(title: "OK", style: .destructive) { _ in completionHandler(true) })
                  topViewController()?.present(alert, animated: true)
              }

              func webView(_ webView: WKWebView, runJavaScriptTextInputPanelWithPrompt prompt: String, defaultText: String?, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (String?) -> Void) {
                  let alert = UIAlertController(title: prompt, message: nil, preferredStyle: .alert)
                  alert.addTextField { tf in tf.text = defaultText; tf.placeholder = "Paste save data..." }
                  alert.addAction(UIAlertAction(title: "Cancel", style: .cancel) { _ in completionHandler(nil) })
                  alert.addAction(UIAlertAction(title: "Import", style: .default) { _ in completionHandler(alert.textFields?.first?.text) })
                  topViewController()?.present(alert, animated: true)
              }
          }

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EOF

          # 2. Compile with Swiftc
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -O \
            -o "$APP_DIR/DodecaDragons" \
            main.swift

          # 3. Write Info.plist
          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DodecaDragons</string>
              <key>CFBundleIdentifier</key>
              <string>com.demonin.dodecadragons</string>
              <key>CFBundleName</key>
              <string>DodecaDragons</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.8</string>
              <key>CFBundleVersion</key>
              <string>9</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UILaunchScreen</key><dict/>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIStatusBarHidden</key><true/>
              <key>UIViewControllerBasedStatusBarAppearance</key><true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # 4. Sign binary
          brew install dpkg ldid
          ldid -S "$APP_DIR/DodecaDragons"

          # 5. Package as .deb
          mkdir -p deb_root/DEBIAN deb_root/Applications
          cp -r "$APP_DIR" deb_root/Applications/
          cat << 'EOF' > deb_root/DEBIAN/control
          Package: com.demonin.dodecadragons
          Name: DodecaDragons
          Version: 1.0.8
          Architecture: iphoneos-arm64
          Description: DodecaDragons native iOS port - Fixed Overlays & Source Patched Start
          Maintainer: Demonin
          Author: Demonin
          Section: Games
          EOF
          chmod 755 deb_root/DEBIAN
          dpkg-deb -Zxz --build deb_root DodecaDragons_1.0.8_iphoneos-arm64.deb

          # 6. Package as .ipa
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r9 DodecaDragons.ipa Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DodecaDragons-Builds
          path: |
            DodecaDragons_1.0.8_iphoneos-arm64.deb
            DodecaDragons.ipa
