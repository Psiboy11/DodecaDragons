name: Build DodecaDragons DEB and IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14 # Pin to macOS 14 to ensure stability
    steps:
      - name: Checkout DodecaDragons Repo
        uses: actions/checkout@v5

      - name: Downgrade to Xcode 15.4 (Fixes Exit Code 65)
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Compile App Bundle & Package as .deb
        run: |
          mkdir -p iOSApp/Sources/WebAssets
          # Copy the game files into the iOS app folder
          cp -r index.html style.css 98.css changelog.txt savebank.txt fonts img scripts iOSApp/Sources/WebAssets/ 2>/dev/null || true

          # Create minimal Swift wrapper (Fixed statusBar modifier)
          cat << 'EOF' > iOSApp/Sources/DodecaDragonsApp.swift
          import SwiftUI
          import WebKit

          @main
          struct DodecaDragonsApp: App {
              var body: some Scene {
                  WindowGroup {
                      GameWebView()
                          .ignoresSafeArea(.all, edges: .bottom)
                          .statusBarHidden(true)
                  }
              }
          }

          struct GameWebView: UIViewRepresentable {
              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.websiteDataStore = .default()
                  let webView = WKWebView(frame: .zero, configuration: config)
                  if let url = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "WebAssets") {
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }
          EOF

          # Create the Xcode project generator file
          cat << 'EOF' > iOSApp/project.yml
          name: DodecaDragons
          options:
            bundleIdPrefix: com.demonin
            deploymentTarget:
              iOS: "15.0"
          targets:
            DodecaDragons:
              type: application
              platform: iOS
              sources:
                - path: Sources
                  excludes: ["WebAssets/**"]
                - path: Sources/WebAssets
                  type: folder
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.demonin.dodecadragons
                  INFOPLIST_KEY_UIStatusBarHidden: true
                  INFOPLIST_KEY_UILaunchScreen_Generation: true
          EOF

          cd iOSApp
          brew install xcodegen dpkg ldid
          xcodegen generate
          
          # Compile the native iOS binary
          xcodebuild -project DodecaDragons.xcodeproj \
            -scheme DodecaDragons \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Pseudo-sign binary for jailbreak/TrollStore compatibility
          ldid -S build/Build/Products/Release-iphoneos/DodecaDragons.app/DodecaDragons

          # Build the .DEB structure
          mkdir -p deb_pkg/DEBIAN deb_pkg/Applications
          cp -r build/Build/Products/Release-iphoneos/DodecaDragons.app deb_pkg/Applications/

          cat << 'EOF' > deb_pkg/DEBIAN/control
          Package: com.demonin.dodecadragons
          Name: DodecaDragons
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: DodecaDragons native iOS port
          Maintainer: Demonin
          Author: Demonin
          Section: Games
          EOF

          chmod 755 deb_pkg/DEBIAN
          # Generate the .deb file
          dpkg-deb -Zxz --build deb_pkg DodecaDragons_1.0.0_iphoneos-arm64.deb

      - name: Convert .deb to .ipa
        run: |
          cd iOSApp
          # Extract the .deb and zip it into an .ipa
          dpkg-deb -x DodecaDragons_1.0.0_iphoneos-arm64.deb extracted_deb
          mkdir -p Payload
          cp -r extracted_deb/Applications/DodecaDragons.app Payload/
          zip -r9 DodecaDragons.ipa Payload

      - name: Upload Both .deb and .ipa Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DodecaDragons-Builds
          path: |
            iOSApp/DodecaDragons_1.0.0_iphoneos-arm64.deb
            iOSApp/DodecaDragons.ipa
